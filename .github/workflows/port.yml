name: port

# The Rust port's own checks, kept apart from upstream's test.yml so upstream merges stay clean.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: port-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PORT_CRATES: shallot-platform shallot-wgsl shallot-gpu

jobs:
  linux:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
      - name: install Mesa Vulkan driver, validation layers and SPIR-V tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers spirv-tools libx11-6 xvfb
      - name: dependency gate (std and OS bindings only)
        run: |
          status=0
          for crate in $PORT_CRATES; do
            extra=$(cargo tree -p "$crate" -e normal,build --prefix none | grep -v '^shallot' || true)
            if [ -n "$extra" ]; then
              echo "::error::$crate depends on crates outside the workspace:"
              echo "$extra"
              status=1
            fi
          done
          exit $status
      - name: format
        run: for crate in $PORT_CRATES; do cargo fmt -p "$crate" --check; done
      - name: clippy
        run: cargo clippy $(printf -- '-p %s ' $PORT_CRATES) --all-targets -- -D warnings
      - name: tests (under the Vulkan validation layers)
        env:
          SHALLOT_GPU_VALIDATION: "1"
        run: cargo test $(printf -- '-p %s ' $PORT_CRATES)
      - name: triangle example, headless and windowed
        env:
          SHALLOT_GPU_VALIDATION: "1"
        run: |
          cargo run -p shallot-gpu --example triangle -- --headless triangle.png
          xvfb-run -a cargo run -p shallot-gpu --example triangle -- --frames 120
      - uses: actions/upload-artifact@v7
        with:
          name: triangle
          path: triangle.png

  windows:
    # Native Windows: the Win32 backend's build, lints and tests, including a real window.
    # The runner has no Vulkan loader, so GPU tests skip here; the wine job runs them.
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""
      - name: clippy
        shell: bash
        run: cargo clippy $(printf -- '-p %s ' $PORT_CRATES) --all-targets -- -D warnings
      - name: tests
        shell: bash
        run: cargo test $(printf -- '-p %s ' $PORT_CRATES)

  wine:
    # The Windows build on Vulkan: Wine's winevulkan forwards to Mesa's lavapipe, so the GPU
    # tests and the windowed triangle exercise the Win32 window and VK_KHR_win32_surface.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: wine
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-gnu
          rustflags: ""
      - name: install Wine, MinGW and Mesa's Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64 gcc-mingw-w64-x86-64 mesa-vulkan-drivers xvfb
      - name: tests
        run: xvfb-run -a cargo test --target x86_64-pc-windows-gnu $(printf -- '-p %s ' $PORT_CRATES)
      - name: triangle example, headless and windowed
        # Wine reaches the host's Vulkan through its X11 driver, so even headless runs need a
        # display.
        run: |
          xvfb-run -a cargo run --target x86_64-pc-windows-gnu -p shallot-gpu --example triangle -- --headless triangle.png
          xvfb-run -a cargo run --target x86_64-pc-windows-gnu -p shallot-gpu --example triangle -- --frames 120

  macos:
    # The Cocoa window and Vulkan through MoltenVK, which presents to the window's CAMetalLayer
    # with VK_EXT_metal_surface.
    timeout-minutes: 20
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""
      - name: install the Vulkan loader, MoltenVK and the validation layers
        run: |
          brew install vulkan-loader molten-vk vulkan-validationlayers
          prefix=$(brew --prefix)
          echo "DYLD_FALLBACK_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "VK_ADD_LAYER_PATH=$prefix/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          icd=$(find "$(brew --prefix molten-vk)/" -name 'MoltenVK_icd.json' | head -n 1)
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: clippy
        run: cargo clippy $(printf -- '-p %s ' $PORT_CRATES) --all-targets -- -D warnings
      - name: tests (under the Vulkan validation layers)
        env:
          SHALLOT_GPU_VALIDATION: "1"
          # MoltenVK's own errors, such as a Metal shader that fails to compile.
          MVK_CONFIG_LOG_LEVEL: "2"
        run: cargo test $(printf -- '-p %s ' $PORT_CRATES)
      - name: triangle example, headless and windowed
        env:
          SHALLOT_GPU_VALIDATION: "1"
          MVK_CONFIG_LOG_LEVEL: "2"
        run: |
          cargo run -p shallot-gpu --example triangle -- --headless triangle.png
          cargo run -p shallot-gpu --example triangle -- --frames 120
      - uses: actions/upload-artifact@v7
        with:
          name: triangle-macos
          path: triangle.png
